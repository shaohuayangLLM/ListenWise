# ListenWise 后端 — 完整部署（阶段②）
#
# 受控 Demo：FastAPI 同进程后台任务跑转写（无需 Celery/Redis），
# 访问口令保护，连 Supabase Postgres，调阿里云 Fun-ASR + qwen。
# 在 Render 用「Blueprint」导入本仓库即可按此创建。
services:
  - type: web
    name: listenwise-api
    runtime: python
    rootDir: backend
    region: singapore         # 跨境验证已确认可调通国内阿里云
    plan: free                # 免费实例会休眠，首次访问冷启动
    buildCommand: pip install -e .
    # 启动时先跑数据库迁移，再起服务
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Supabase 连接串，需用 asyncpg 驱动
        sync: false                # 形如 postgresql+asyncpg://postgres:<pwd>@<host>:5432/postgres
      - key: DASHSCOPE_API_KEY     # 百炼 key（Fun-ASR + qwen 共用）
        sync: false
      - key: ASR_PROVIDER
        value: dashscope        # fun-asr 无免费额度 → 用 dashscope 走 paraformer-v1（有免费额度）
      - key: ASR_MODEL
        value: paraformer-v1    # v2 免费额度用尽，v1 仍有；同 API、保说话人分离
      - key: APP_SECRET_KEY        # Fernet 主密钥，Render 自动生成随机值
        generateValue: true
      - key: ACCESS_PASSCODE       # 访问口令（受控 Demo）；发给受邀用户
        sync: false
      - key: CORS_ORIGINS          # Vercel 前端域名，如 https://listenwise.vercel.app
        sync: false
